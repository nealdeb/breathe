<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<title>The Routine</title>
<style>
:root{--bg:#090a0d;--panel:#111318;--stroke:#262a33;--text:#f6f7f9;--muted:#8e95a3;--accent:#c9ff45;--accent-dark:#18200a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(201,255,69,.1),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{width:min(100%,560px);margin:auto;padding:24px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:850;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
h1{margin:0;font-size:30px;letter-spacing:-.045em;line-height:1}
.subtitle{margin-top:8px;color:var(--muted);font-size:13px}
.reset{width:42px;height:42px;border:1px solid var(--stroke);border-radius:14px;background:#121419;color:var(--muted)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 2px 10px}
.section-head strong{font-size:14px}
.section-head span{font-size:11px;color:var(--muted);font-weight:800}
.day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day-pill{border:1px solid var(--stroke);background:#111318;border-radius:14px;padding:8px 2px;color:var(--muted);text-align:center}
.day-pill .dow{font-size:9px;font-weight:850;text-transform:uppercase}
.day-pill .date{font-size:15px;font-weight:900;color:#d7dbe2;margin:2px 0}
.day-pill .month{font-size:9px;text-transform:uppercase}
.day-pill.active{border-color:var(--accent);background:var(--accent-dark)}
.day-pill.active .date{color:var(--accent)}
.day-pill.has-data:after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin:5px auto 0}
.habit-progress,.progress{height:5px;background:#1c1f26;border-radius:999px;overflow:hidden;margin-bottom:14px}
.habit-progress>div,.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s ease}
.habit-list{display:flex;flex-direction:column;gap:9px}
.habit{background:linear-gradient(180deg,#15171c,#111318);border:1px solid var(--stroke);border-radius:18px;padding:12px 13px;display:flex;align-items:center;gap:12px}
.habit.done{border-color:rgba(201,255,69,.34)}
.habit-icon{width:38px;height:38px;display:grid;place-items:center;background:#1d2026;border-radius:12px;font-size:17px;flex:none}
.habit-copy{flex:1;min-width:0}
.habit-name{font-size:14px;font-weight:830}
.habit-meta{color:var(--muted);font-size:11px;margin-top:3px}
.habit.done .habit-name{color:#aeb79b}
.habit-check{appearance:none;width:26px;height:26px;flex:none;border-radius:8px;border:1px solid #373d47;background:#171a20;display:grid;place-content:center}
.habit-check:before{content:"✓";font-size:15px;font-weight:1000;color:#0a0d07;transform:scale(0)}
.habit-check:checked{background:var(--accent);border-color:var(--accent)}
.habit-check:checked:before{transform:scale(1)}
.workout-section{display:none;margin-top:24px}
.workout-section.visible{display:block}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#101216;border:1px solid var(--stroke);padding:5px;border-radius:16px;position:sticky;top:8px;z-index:10}
.tab{border:0;border-radius:11px;padding:10px 7px;background:transparent;color:#777e8c;font-size:12px;font-weight:800}
.tab.active{background:var(--accent);color:#0b0d08}
.session{margin:18px 0 14px;display:flex;justify-content:space-between;align-items:flex-end}
.day-label{color:var(--muted);font-size:12px;margin-bottom:4px}
.day-title{font-size:21px;font-weight:850}
.progress-copy{color:var(--muted);font-size:12px;font-weight:700}
.workout-list{display:flex;flex-direction:column;gap:12px}
.exercise{background:linear-gradient(180deg,#15171c,#111318);border:1px solid var(--stroke);border-radius:20px;overflow:hidden}
.exercise.done{border-color:rgba(201,255,69,.42)}
.exercise-head{display:flex;gap:12px;padding:16px;align-items:flex-start;cursor:pointer}
.num{width:32px;height:32px;display:grid;place-items:center;background:#20232a;border-radius:10px;color:#aeb4c0;font-size:12px;font-weight:900;flex:none}
.exercise.done .num{background:var(--accent-dark);color:var(--accent)}
.exercise-info{flex:1;min-width:0}
.exercise-name{font-size:16px;font-weight:820}
.target{color:var(--muted);font-size:12px;margin-top:5px}
.exercise-check{width:34px;height:34px;border:1px solid #343944;border-radius:12px;background:#181b21;color:transparent;display:grid;place-items:center;font-size:18px;font-weight:1000;flex:none}
.exercise.done .exercise-check{background:var(--accent);border-color:var(--accent);color:#0b0e08}
.sets{display:none;border-top:1px solid var(--stroke);padding:10px 12px 14px}
.sets.expanded{display:block}
.set-header,.set-row{display:grid;grid-template-columns:38px 1fr 1fr 44px;gap:8px;align-items:center}
.set-header{padding:1px 3px 7px;color:#69707d;font-size:10px;font-weight:850;text-transform:uppercase}
.set-row{padding:5px 0}
.set-no{color:#777f8d;font-size:12px;font-weight:850;text-align:center}
.field{height:40px;border:1px solid #292d36;background:#0d0f13;border-radius:11px;color:var(--text);padding:0 10px;width:100%;outline:none;text-align:center;font-weight:750}
.set-check{width:40px;height:40px;border:1px solid #2d323c;border-radius:11px;background:#1a1d23;color:#747c89;display:grid;place-items:center;font-size:17px;font-weight:900}
.set-row.completed .field{color:#69705e;background:#11150c;border-color:#202917}
.set-row.completed .set-check{background:var(--accent);color:#090c06;border-color:var(--accent)}
.set-actions{display:flex;gap:8px;margin-top:9px}
.add-set{flex:1;height:38px;border:1px dashed #373d48;border-radius:11px;background:transparent;color:#a6acb7;font-size:12px;font-weight:800}
.remove-set{height:38px;border:0;padding:0 12px;border-radius:11px;background:#1c1719;color:#b47b82;font-size:12px;font-weight:800}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:100}
.modal-backdrop.show{display:flex}
.modal{width:min(100%,520px);background:#15171c;border:1px solid #2a2f38;border-radius:22px;padding:18px}
.modal h2{font-size:19px;margin:0 0 6px}
.modal p{font-size:12px;color:var(--muted);margin:0 0 16px}
.modal-input-wrap{display:flex;align-items:center;gap:10px;background:#0d0f13;border:1px solid #2a2f38;border-radius:14px;padding:0 12px}
.modal-input{width:100%;height:48px;background:transparent;border:0;outline:0;color:#fff;font-size:18px;font-weight:800}
.modal-unit{color:var(--muted);font-size:12px;font-weight:800}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.modal-actions button{height:44px;border-radius:12px;font-weight:850}
.cancel{border:1px solid #30353f;background:#171a20;color:#aeb4c0}
.save-btn{border:0;background:var(--accent);color:#0b0d08}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#f3f6ea;color:#10120d;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.22s ease;z-index:120}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer-note{margin:18px 4px 0;color:#656b76;font-size:11px;text-align:center}
@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.day-strip{gap:4px}.set-header,.set-row{grid-template-columns:32px 1fr 1fr 40px;gap:6px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div>
    <div class="eyebrow">Daily system</div>
    <h1>The Routine.</h1>
    <div class="subtitle">Track the day. Keep the streak moving.</div>
  </div>
  <button class="reset" id="resetDayBtn">↻</button>
</header>

<div class="section-head"><strong>Daily Tracker</strong><span id="selectedDateLabel"></span></div>
<div class="day-strip" id="dayStrip"></div>
<div class="habit-progress"><div id="habitProgressBar"></div></div>

<section class="habit-list">
  <label class="habit" id="habit-walk">
    <div class="habit-icon">🚶</div>
    <div class="habit-copy"><div class="habit-name">Morning Walk</div><div class="habit-meta" id="walkMeta">Outdoor walk</div></div>
    <input class="habit-check" id="walkDone" type="checkbox">
  </label>

  <label class="habit" id="habit-breakfast">
    <div class="habit-icon">🍳</div>
    <div class="habit-copy"><div class="habit-name">Breakfast</div><div class="habit-meta">Start fueled</div></div>
    <input class="habit-check" id="breakfastDone" type="checkbox">
  </label>

  <label class="habit" id="habit-meds">
    <div class="habit-icon">💊</div>
    <div class="habit-copy"><div class="habit-name">Take Meds</div><div class="habit-meta">Daily medication check</div></div>
    <input class="habit-check" id="medsDone" type="checkbox">
  </label>

  <label class="habit" id="habit-workout">
    <div class="habit-icon">🏋️</div>
    <div class="habit-copy"><div class="habit-name">Start Workout</div><div class="habit-meta">Opens workout tracker below</div></div>
    <input class="habit-check" id="workoutDone" type="checkbox">
  </label>

  <label class="habit" id="habit-study">
    <div class="habit-icon">📚</div>
    <div class="habit-copy"><div class="habit-name">Study</div><div class="habit-meta" id="studyMeta">20-minute focus blocks</div></div>
    <input class="habit-check" id="studyDone" type="checkbox">
  </label>

  <label class="habit" id="habit-app">
    <div class="habit-icon">⚡</div>
    <div class="habit-copy"><div class="habit-name">App Work</div><div class="habit-meta">Make one meaningful improvement</div></div>
    <input class="habit-check" id="appDone" type="checkbox">
  </label>
</section>

<section class="workout-section" id="workoutSection">
  <div class="section-head"><strong>Workout</strong><span>Tap exercise to expand</span></div>
  <nav class="tabs" id="tabs"></nav>
  <section class="session">
    <div><div class="day-label" id="dayLabel"></div><div class="day-title" id="dayTitle"></div></div>
    <div class="progress-copy" id="progressCopy"></div>
  </section>
  <div class="progress"><div id="progressBar"></div></div>
  <section class="workout-list" id="workoutList"></section>
</section>

<div class="footer-note">Daily habits and workout entries are stored locally on this device.</div>
</main>

<div class="modal-backdrop" id="entryModal">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p id="modalHelp"></p>
    <div class="modal-input-wrap">
      <input class="modal-input" id="modalInput">
      <span class="modal-unit" id="modalUnit"></span>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="modalCancel" type="button">Cancel</button>
      <button class="save-btn" id="modalSave" type="button">Save & complete</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const workout=[
{day:"Day 1",title:"Chest + Triceps",exercises:[
["Dumbbell Floor/Bench Press","3 × 8–12",3,"8–12"],
["Dumbbell Fly","3 × 10–12",3,"10–12"],
["Overhead Triceps Extension","3 × 10–12",3,"10–12"],
["Dumbbell Skull Crushers","3 × 10–12",3,"10–12"]]},
{day:"Day 2",title:"Back + Biceps",exercises:[
["One-Arm Dumbbell Row","3 × 8–12",3,"8–12"],
["Bent-Over Dumbbell Row","3 × 8–12",3,"8–12"],
["Dumbbell Biceps Curl","3 × 10–12",3,"10–12"],
["Hammer Curl","3 × 10–12",3,"10–12"]]},
{day:"Day 3",title:"Shoulders + Legs",exercises:[
["Dumbbell Shoulder Press","3 × 8–12",3,"8–12"],
["Dumbbell Lateral Raise","3 × 12–15",3,"12–15"],
["Rear-Delt Fly","3 × 12–15",3,"12–15"],
["Squat","3 × 8–12",3,"8–12"],
["Lunges","3 × 10",3,"10"],
["Calf Raise","3 × 15–20",3,"15–20"]]}
];

const DAILY_KEY="theRoutineDailyV2";
const WORKOUT_KEY="dumbbellTrackerV1";
let selectedDate=todayKey();
let activeDay=Number(localStorage.getItem(WORKOUT_KEY+"_active"))||0;
let workoutState=loadWorkout();
let expanded=[null,null,null];
let modalType=null;

function todayKey(){
  const d=new Date();
  return keyFromDate(d);
}
function keyFromDate(d){
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
}
function dateFromKey(k){
  const [y,m,d]=k.split("-").map(Number);
  return new Date(y,m-1,d);
}
function blankDay(){
  return {walkDone:false,walkKm:"",breakfastDone:false,medsDone:false,workoutDone:false,studyDone:false,studyBlocks:"",appDone:false};
}
function loadDaily(){
  try{return JSON.parse(localStorage.getItem(DAILY_KEY)||"{}")}catch{return {}}
}
function saveDaily(x){localStorage.setItem(DAILY_KEY,JSON.stringify(x))}
function getRecord(){
  const all=loadDaily();
  if(!all[selectedDate]) all[selectedDate]=blankDay();
  return [all,all[selectedDate]];
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.classList.remove("show"),1200);
}
function renderDayStrip(){
  const root=document.getElementById("dayStrip");
  const base=dateFromKey(selectedDate);
  const all=loadDaily();
  root.innerHTML="";
  for(let i=-3;i<=3;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    const key=keyFromDate(d),r=all[key];
    const has=r&&[r.walkDone,r.breakfastDone,r.medsDone,r.workoutDone,r.studyDone,r.appDone].some(Boolean);
    const b=document.createElement("button");
    b.type="button";b.className="day-pill"+(key===selectedDate?" active":"")+(has?" has-data":"");
    b.innerHTML=`<div class="dow">${d.toLocaleDateString(undefined,{weekday:"short"})}</div><div class="date">${d.getDate()}</div><div class="month">${d.toLocaleDateString(undefined,{month:"short"})}</div>`;
    b.onclick=()=>{selectedDate=key;renderDaily()};
    root.appendChild(b);
  }
}
function renderDaily(){
  const [all,r]=getRecord();saveDaily(all);
  const d=dateFromKey(selectedDate);
  document.getElementById("selectedDateLabel").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  const map=[["walk",r.walkDone],["breakfast",r.breakfastDone],["meds",r.medsDone],["workout",r.workoutDone],["study",r.studyDone],["app",r.appDone]];
  map.forEach(([id,v])=>{
    document.getElementById(id+"Done").checked=!!v;
    document.getElementById("habit-"+id).classList.toggle("done",!!v);
  });
  document.getElementById("walkMeta").textContent=r.walkDone&&r.walkKm?`${r.walkKm} km outdoor walk`:"Outdoor walk";
  document.getElementById("studyMeta").textContent=r.studyDone&&r.studyBlocks?`${r.studyBlocks} × 20 min blocks`:"20-minute focus blocks";
  const done=map.filter(x=>x[1]).length;
  document.getElementById("habitProgressBar").style.width=`${done/6*100}%`;
  document.getElementById("workoutSection").classList.toggle("visible",!!r.workoutDone);
  renderDayStrip();
}
function updateSimple(field,value){
  const [all,r]=getRecord();r[field]=value;saveDaily(all);renderDaily();
}
function openMetricModal(type){
  modalType=type;
  const [,r]=getRecord();
  const input=document.getElementById("modalInput");
  if(type==="walk"){
    document.getElementById("modalTitle").textContent="Morning Walk";
    document.getElementById("modalHelp").textContent="How many kilometres did you walk outdoors?";
    document.getElementById("modalUnit").textContent="km";
    input.value=r.walkKm||"";input.inputMode="decimal";input.placeholder="2.5";
  }else{
    document.getElementById("modalTitle").textContent="Study";
    document.getElementById("modalHelp").textContent="How many 20-minute study blocks did you complete?";
    document.getElementById("modalUnit").textContent="blocks";
    input.value=r.studyBlocks||"";input.inputMode="numeric";input.placeholder="3";
  }
  document.getElementById("entryModal").classList.add("show");
  setTimeout(()=>input.focus(),50);
}
function closeModal(){document.getElementById("entryModal").classList.remove("show");modalType=null}
function saveModal(){
  const raw=document.getElementById("modalInput").value.trim();
  const n=Number(raw);
  if(!raw||!Number.isFinite(n)||n<=0){showToast("Enter a value above 0");return}
  const [all,r]=getRecord();
  if(modalType==="walk"){r.walkKm=String(Math.round(n*100)/100);r.walkDone=true}
  else{r.studyBlocks=String(Math.max(1,Math.min(24,Math.round(n))));r.studyDone=true}
  saveDaily(all);closeModal();renderDaily();
}
document.getElementById("walkDone").onchange=e=>{if(e.target.checked){e.target.checked=false;openMetricModal("walk")}else updateSimple("walkDone",false)};
document.getElementById("studyDone").onchange=e=>{if(e.target.checked){e.target.checked=false;openMetricModal("study")}else updateSimple("studyDone",false)};
document.getElementById("breakfastDone").onchange=e=>updateSimple("breakfastDone",e.target.checked);
document.getElementById("medsDone").onchange=e=>updateSimple("medsDone",e.target.checked);
document.getElementById("appDone").onchange=e=>updateSimple("appDone",e.target.checked);
document.getElementById("workoutDone").onchange=e=>{
  updateSimple("workoutDone",e.target.checked);
  if(e.target.checked)setTimeout(()=>document.getElementById("workoutSection").scrollIntoView({behavior:"smooth",block:"start"}),80);
};
document.getElementById("modalCancel").onclick=closeModal;
document.getElementById("modalSave").onclick=saveModal;
document.getElementById("entryModal").onclick=e=>{if(e.target.id==="entryModal")closeModal()};
document.getElementById("modalInput").onkeydown=e=>{if(e.key==="Enter")saveModal()};
document.getElementById("resetDayBtn").onclick=()=>{
  const d=dateFromKey(selectedDate).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  if(!confirm(`Reset habits for ${d}?`))return;
  const all=loadDaily();all[selectedDate]=blankDay();saveDaily(all);renderDaily();showToast("Day reset");
};

function defaultWorkout(){
  return workout.map(day=>day.exercises.map(ex=>Array.from({length:ex[2]},()=>({reps:"",weight:"",done:false}))));
}
function loadWorkout(){
  try{return JSON.parse(localStorage.getItem(WORKOUT_KEY))||defaultWorkout()}catch{return defaultWorkout()}
}
function saveWorkout(){
  localStorage.setItem(WORKOUT_KEY,JSON.stringify(workoutState));
  localStorage.setItem(WORKOUT_KEY+"_active",activeDay);
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=workout.map((d,i)=>`<button class="tab ${i===activeDay?"active":""}" onclick="changeDay(${i})">D${i+1}</button>`).join("");
}
function changeDay(i){activeDay=i;saveWorkout();renderWorkout()}
function renderWorkout(){
  renderTabs();
  const day=workout[activeDay];
  document.getElementById("dayLabel").textContent=day.day;
  document.getElementById("dayTitle").textContent=day.title;
  document.getElementById("workoutList").innerHTML=day.exercises.map((ex,e)=>{
    const sets=workoutState[activeDay][e];
    const done=sets.length&&sets.every(s=>s.done);
    return `<article class="exercise ${done?"done":""}">
      <div class="exercise-head" onclick="toggleExpand(${e})">
        <div class="num">${String(e+1).padStart(2,"0")}</div>
        <div class="exercise-info"><div class="exercise-name">${ex[0]}</div><div class="target">Target · ${ex[1]}</div></div>
        <button class="exercise-check" onclick="event.stopPropagation();toggleExercise(${e})">✓</button>
      </div>
      <div class="sets ${expanded[activeDay]===e&&!done?"expanded":""}">
        <div class="set-header"><span>Set</span><span>Reps</span><span>kg</span><span>Done</span></div>
        ${sets.map((s,si)=>`<div class="set-row ${s.done?"completed":""}">
          <div class="set-no">${si+1}</div>
          <input class="field" inputmode="numeric" placeholder="${ex[3]}" value="${s.reps}" onchange="updateSet(${e},${si},'reps',this.value)">
          <input class="field" inputmode="decimal" placeholder="—" value="${s.weight}" onchange="updateSet(${e},${si},'weight',this.value)">
          <button class="set-check" onclick="toggleSet(${e},${si})">✓</button>
        </div>`).join("")}
        <div class="set-actions">
          <button class="add-set" onclick="addSet(${e})">＋ Add set</button>
          ${sets.length>1?`<button class="remove-set" onclick="removeSet(${e})">Remove</button>`:""}
        </div>
      </div>
    </article>`;
  }).join("");
  const sets=workoutState[activeDay].flat();
  const completed=sets.filter(s=>s.done).length;
  document.getElementById("progressCopy").textContent=`${completed} / ${sets.length} sets`;
  document.getElementById("progressBar").style.width=`${sets.length?completed/sets.length*100:0}%`;
}
function toggleExpand(e){
  const sets=workoutState[activeDay][e];
  if(sets.every(s=>s.done))return;
  expanded[activeDay]=expanded[activeDay]===e?null:e;
  renderWorkout();
}
function updateSet(e,s,key,value){workoutState[activeDay][e][s][key]=value;saveWorkout()}
function toggleSet(e,s){
  workoutState[activeDay][e][s].done=!workoutState[activeDay][e][s].done;
  if(workoutState[activeDay][e].every(x=>x.done))expanded[activeDay]=null;
  saveWorkout();renderWorkout();
}
function toggleExercise(e){
  const sets=workoutState[activeDay][e];
  const done=!sets.every(s=>s.done);
  sets.forEach(s=>s.done=done);
  if(done)expanded[activeDay]=null;
  saveWorkout();renderWorkout();
}
function addSet(e){workoutState[activeDay][e].push({reps:"",weight:"",done:false});saveWorkout();renderWorkout()}
function removeSet(e){if(workoutState[activeDay][e].length>1){workoutState[activeDay][e].pop();saveWorkout();renderWorkout()}}

renderDaily();
renderWorkout();
</script>
</body>
</html>
