<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070807">
<title>Breathe & Meditate</title>
<style>
:root{--bg:#070807;--text:#f5f7f4;--muted:#8b928a;--accent:#c8ff4d;--panel:rgba(255,255,255,.035)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}body{height:100dvh;overflow:hidden;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 30%,rgba(200,255,77,.07),transparent 30%),var(--bg)}button{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(100%,430px);height:100dvh;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 20px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:17px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055)}.tab{height:42px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-size:13px;font-weight:750}.tab.active{background:var(--accent);color:#11150c}.view{flex:1;min-height:0;display:none;flex-direction:column}.view.active{display:flex}.header{text-align:center;padding-top:2px}.eyebrow{margin:0 0 3px;color:var(--accent);font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(23px,7vw,29px);line-height:1.05;letter-spacing:-.04em}.subtitle{margin:6px 0 0;color:var(--muted);font-size:12px}.breathing-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:4px 0}.breathing{position:relative;width:min(68vw,34vh,275px);height:min(68vw,34vh,275px);display:grid;place-items:center}.breath-orb{position:absolute;width:72%;height:72%;border-radius:50%;background:rgba(200,255,77,.14);box-shadow:0 0 48px rgba(200,255,77,.13),0 0 90px rgba(200,255,77,.06);transform:scale(.72);will-change:transform}.center{position:relative;z-index:2;text-align:center;user-select:none}.phase{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.count{margin-top:5px;font-size:clamp(42px,13vw,56px);line-height:1;font-weight:800;letter-spacing:-.05em}.cue{margin-top:7px;color:var(--muted);font-size:11px;max-width:220px}.rep-counter{display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 12px;border:1px solid rgba(200,255,77,.12);border-radius:15px;background:rgba(200,255,77,.035)}.rep-number{min-width:30px;height:30px;padding:0 8px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:#11150c;font-size:14px;font-weight:850}.rep-text{color:var(--muted);font-size:11px;font-weight:700}.primary{width:100%;height:50px;border:0;border-radius:16px;background:var(--accent);color:#11150c;font-size:15px;font-weight:850}.breath-controls{margin-top:14px}.meta{margin-top:7px;display:flex;justify-content:center;gap:12px;color:var(--muted);font-size:10px}.meditation-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:6px 0}.meditation-orb{width:min(58vw,27vh,210px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(200,255,77,.07);box-shadow:0 0 45px rgba(200,255,77,.08),0 0 100px rgba(200,255,77,.035)}.meditation-orb.active{animation:meditatePulse 6s ease-in-out infinite alternate}@keyframes meditatePulse{from{transform:scale(.94);opacity:.82}to{transform:scale(1.05);opacity:1}}.timer{text-align:center}.timer-value{font-size:clamp(44px,14vw,60px);line-height:1;font-weight:800;letter-spacing:-.055em}.timer-label{margin-top:7px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.duration-row{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.duration-btn{height:40px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:var(--panel);color:var(--muted);font-size:12px;font-weight:750}.duration-btn.active{border-color:rgba(200,255,77,.35);background:rgba(200,255,77,.09);color:var(--accent)}.meditation-message{min-height:17px;color:var(--muted);font-size:11px;text-align:center}.meditation-controls{width:100%;display:grid;grid-template-columns:1fr auto;gap:9px}.reset{width:50px;height:50px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:var(--panel);color:var(--text);font-size:18px}@media(max-height:670px){.app{gap:8px}.tab{height:38px}.subtitle{display:none}.breathing{width:min(60vw,29vh,220px);height:min(60vw,29vh,220px)}.breath-controls{margin-top:10px}.meta{display:none}.meditation-body{gap:12px}.meditation-orb{width:min(50vw,23vh,170px)}.duration-btn{height:37px}}@media(prefers-reduced-motion:reduce){.meditation-orb.active{animation:none}}
</style>
</head>
<body>
<main class="app">
<nav class="tabs" aria-label="App sections"><button class="tab active" id="breatheTab" type="button">Breathe</button><button class="tab" id="meditateTab" type="button">Meditate</button></nav>
<section class="view active" id="breatheView">
<header class="header"><p class="eyebrow">Breathe</p><h1>4–6 Breathing</h1><p class="subtitle">Inhale for 4 · Exhale for 6</p></header>
<div class="breathing-wrap"><div class="breathing"><div class="breath-orb" id="breathOrb"></div><div class="center"><div class="phase" id="phase">Ready</div><div class="count" id="count">4</div><div class="cue" id="cue">Tap start when you're comfortable</div></div></div></div>
<div class="rep-counter" aria-live="polite"><span class="rep-number" id="reps">0</span><span class="rep-text" id="repLabel">breaths completed</span></div>
<div class="breath-controls"><button class="primary" id="breathToggle" type="button">Start breathing</button><div class="meta"><span>4 sec inhale</span><span>•</span><span>6 sec exhale</span></div></div>
</section>
<section class="view" id="meditateView">
<header class="header"><p class="eyebrow">Meditate</p><h1>Quiet Time</h1><p class="subtitle">Sit comfortably · Relax your shoulders · Observe</p></header>
<div class="meditation-body"><div class="meditation-orb" id="meditationOrb"><div class="timer"><div class="timer-value" id="timerValue">05:00</div><div class="timer-label" id="timerLabel">Ready</div></div></div><div class="duration-row"><button class="duration-btn active" type="button" data-minutes="5">5 min</button><button class="duration-btn" type="button" data-minutes="10">10 min</button><button class="duration-btn" type="button" data-minutes="15">15 min</button><button class="duration-btn" type="button" data-minutes="20">20 min</button></div><div class="meditation-message" id="meditationMessage">Let thoughts come and go without following them.</div></div>
<div class="meditation-controls"><button class="primary" id="meditateToggle" type="button">Start meditation</button><button class="reset" id="meditateReset" type="button" aria-label="Reset meditation">↺</button></div>
</section>
</main>
<script>
const breatheTab=document.getElementById('breatheTab'),meditateTab=document.getElementById('meditateTab'),breatheView=document.getElementById('breatheView'),meditateView=document.getElementById('meditateView');function openView(name){const b=name==='breathe';breatheTab.classList.toggle('active',b);meditateTab.classList.toggle('active',!b);breatheView.classList.toggle('active',b);meditateView.classList.toggle('active',!b)}breatheTab.addEventListener('click',()=>openView('breathe'));meditateTab.addEventListener('click',()=>openView('meditate'));
const phaseEl=document.getElementById('phase'),countEl=document.getElementById('count'),cueEl=document.getElementById('cue'),breathToggle=document.getElementById('breathToggle'),breathOrb=document.getElementById('breathOrb'),repsEl=document.getElementById('reps'),repLabelEl=document.getElementById('repLabel');let breathRunning=false,breathRaf=null,phaseStart=0,currentPhase='inhale',completedReps=0;const phases={inhale:{duration:4000,label:'Inhale',cue:'Slowly breathe in through your nose',fromScale:.72,toScale:1},exhale:{duration:6000,label:'Exhale',cue:'Gently let the breath out',fromScale:1,toScale:.72}};function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}function beginPhase(name,ts){currentPhase=name;phaseStart=ts;const p=phases[name];phaseEl.textContent=p.label;cueEl.textContent=p.cue}function breathTick(ts){if(!breathRunning)return;const p=phases[currentPhase],elapsed=ts-phaseStart,n=Math.min(elapsed/p.duration,1);countEl.textContent=Math.max(1,Math.ceil((p.duration-elapsed)/1000));const e=easeInOut(n),scale=p.fromScale+(p.toScale-p.fromScale)*e;breathOrb.style.transform=`scale(${scale})`;if(elapsed>=p.duration){if(currentPhase==='exhale'){completedReps++;repsEl.textContent=completedReps;repLabelEl.textContent=completedReps===1?'breath completed':'breaths completed';if(repsEl.animate)repsEl.animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'})}beginPhase(currentPhase==='inhale'?'exhale':'inhale',ts)}breathRaf=requestAnimationFrame(breathTick)}function startBreathing(){breathRunning=true;breathToggle.textContent='Pause';beginPhase('inhale',performance.now());breathRaf=requestAnimationFrame(breathTick)}function pauseBreathing(){breathRunning=false;cancelAnimationFrame(breathRaf);breathToggle.textContent='Resume';phaseEl.textContent='Paused';cueEl.textContent='Continue whenever you’re ready'}breathToggle.addEventListener('click',()=>breathRunning?pauseBreathing():startBreathing());
const timerValue=document.getElementById('timerValue'),timerLabel=document.getElementById('timerLabel'),meditateToggle=document.getElementById('meditateToggle'),meditateReset=document.getElementById('meditateReset'),meditationOrb=document.getElementById('meditationOrb'),meditationMessage=document.getElementById('meditationMessage'),durationButtons=[...document.querySelectorAll('.duration-btn')];let selectedMinutes=5,meditationRemaining=300,meditationRunning=false,meditationInterval=null;const messages=['Let thoughts come and go without following them.','Relax your jaw and soften your shoulders.','Notice the breath without trying to control it.','Return gently whenever your mind wanders.','Nothing to solve. Just notice this moment.'];function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function renderMeditationTime(){timerValue.textContent=formatTime(meditationRemaining)}function stopMeditationInterval(){if(meditationInterval)clearInterval(meditationInterval);meditationInterval=null}function startMeditation(){if(meditationRemaining<=0)meditationRemaining=selectedMinutes*60;meditationRunning=true;meditateToggle.textContent='Pause';timerLabel.textContent='Meditating';meditationOrb.classList.add('active');let i=0;meditationMessage.textContent=messages[0];stopMeditationInterval();meditationInterval=setInterval(()=>{meditationRemaining--;if(meditationRemaining<=0){meditationRemaining=0;renderMeditationTime();stopMeditationInterval();meditationRunning=false;meditationOrb.classList.remove('active');timerLabel.textContent='Complete';meditationMessage.textContent='Session complete. Take a moment before moving.';meditateToggle.textContent='Start again';return}if(meditationRemaining%45===0){i=(i+1)%messages.length;meditationMessage.textContent=messages[i]}renderMeditationTime()},1000)}function pauseMeditation(){meditationRunning=false;stopMeditationInterval();meditationOrb.classList.remove('active');meditateToggle.textContent='Resume';timerLabel.textContent='Paused';meditationMessage.textContent='Resume when you feel ready.'}function resetMeditation(){meditationRunning=false;stopMeditationInterval();meditationRemaining=selectedMinutes*60;meditationOrb.classList.remove('active');timerLabel.textContent='Ready';meditateToggle.textContent='Start meditation';meditationMessage.textContent=messages[0];renderMeditationTime()}meditateToggle.addEventListener('click',()=>meditationRunning?pauseMeditation():startMeditation());meditateReset.addEventListener('click',resetMeditation);durationButtons.forEach(btn=>btn.addEventListener('click',()=>{if(meditationRunning)return;selectedMinutes=Number(btn.dataset.minutes);durationButtons.forEach(b=>b.classList.toggle('active',b===btn));resetMeditation()}));renderMeditationTime();
</script>
</body></html>
